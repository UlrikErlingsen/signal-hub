# The only place Signal Hub lists apps. The sidebar, the front-page cards, requirements-apps.txt, the theme sync
# and the smoke tests are all generated from this file. To update an app: release it (bump version, CHANGELOG,
# tag vX.Y.Z), change its `tag:` line here, run the tests, redeploy.
#
# slug      short id; also the session-state namespace inside the Hub ("track:raw_data")
# key       signal_theme.APPS key (mark, family colour, tagline)
# product   display name, with a space
# repo      GitHub repo under UlrikErlingsen
# dist      pip distribution name (pyproject [project].name)
# package   import name (src/<package>)
# tag       released tag the Hub pins
# family    Brand | Market | Customer | Research | Decide  (the sidebar section)
# mode      embedded (package exposes <package>.ui.render) | link (open demo_url) | coming_soon
# public    false while the repo is private; the Hub then shows no source link
# question  the one question the app answers (from the README)
# one_liner the README's promise line
# methods   2-4 method chips for the cards
# max_upload_mb  the app's own Streamlit upload cap (written to its .streamlit/config.toml by sync_theme)

- slug: track
  key: track
  product: Track Signal
  repo: brand-tracking
  dist: tracksignal
  package: tracksignal
  tag: v1.1.0
  family: Brand
  mode: embedded
  public: true
  max_upload_mb: 50
  question: Is the brand moving, or is the tracker just noisy?
  one_liner: Brand-tracking waves compared with intervals, multiple-comparison control and practical thresholds, so real movement is separated from sampling noise.
  methods: [Wilson intervals, Wave contrasts, BH control]

