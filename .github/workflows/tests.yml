name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hub:
    name: Hub (registry, home page, theme sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the Hub without apps
        run: pip install -e ".[test]"
      - name: Every generated list matches apps.yaml
        run: python scripts/sync_suite.py --check --hub-only
      - run: python -m ruff check .
      - run: python -m pytest -q -m "not apps"

  apps:
    name: All pinned apps in one environment
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install every pinned app plus the Hub (fails on resolver conflicts)
        run: pip install -r requirements.txt -e ".[test]"
      - name: Dependency check
        run: pip check
      - name: Smoke-test every embedded app
        run: python -m pytest -q
